name: Game Store Deploy
on:
  push:
    branches: [game-store]
    paths: ['gamestore/**', '.github/workflows/gamestore-deploy.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamestore
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: kv-namespace
        run: |
          A="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ID=$(curl -sf -H "$H" "$A?per_page=100" | jq -r '.result[] | select(.title=="game-store-STORE") | .id')
          if [ -z "$ID" ]; then
            ID=$(curl -sf -X POST -H "$H" -H "Content-Type: application/json" -d '{"title":"game-store-STORE"}' "$A" | jq -r '.result.id')
          fi
          [ -n "$ID" ] && [ "$ID" != "null" ]
          sed -i "s/REPLACE_KV_ID/$ID/" wrangler.toml
      - name: deploy
        run: npx -y wrangler@4 deploy
      - name: admin-secret
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: printf '%s' "$ADMIN_PASSWORD" | npx -y wrangler@4 secret put ADMIN_PASSWORD
