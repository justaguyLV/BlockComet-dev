name = "game-store"
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/files/*", "/dl/*"]

[[d1_databases]]
binding = "DB"
database_name = "game-store"
database_id = "REPLACE_DB_ID"

[[r2_buckets]]
binding = "FILES"
bucket_name = "game-store-files"
