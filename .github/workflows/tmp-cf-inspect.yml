name: tmp-cf-inspect
on:
  push:
    branches: [tmp-cf-inspect]
    paths: ['.github/workflows/tmp-cf-inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch worker source and settings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p out
          B="https://api.cloudflare.com/client/v4/accounts/$CF_ACC/workers/scripts/blockcomet-skins"
          curl -s -H "Authorization: Bearer $CF_TOKEN" "$B/content/v2" -o out/raw.txt
          python3 - <<'PY'
          import re
          raw=open('out/raw.txt','rb').read().decode()
          b=raw.split('\r\n',1)[0]
          parts=raw.split(b)
          for p in parts:
              if 'filename="index.js"' in p:
                  body=p.split('\r\n\r\n',1)[1]
                  body=body.rstrip('\r\n').rstrip('-')
                  open('out/index.js','w').write(body)
          PY
          curl -s -H "Authorization: Bearer $CF_TOKEN" "$B/settings" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result',{}); print(json.dumps({k:(v if k!='bindings' else [{kk:vv for kk,vv in b.items() if kk!='text'} for b in v]) for k,v in r.items()},indent=1))" > out/settings.json
          curl -s -H "Authorization: Bearer $CF_TOKEN" "$B/subdomain" > out/subdomain.json
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACC/workers/subdomain" > out/acc_subdomain.json
          rm out/raw.txt
          git config user.name bot; git config user.email bot@example.com
          git add out && git commit -m "worker" && git push
