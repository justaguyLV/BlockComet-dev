name: Game Store Deploy
on:
  push:
    branches: [game-store]
    paths: ['gamestore/**', '.github/workflows/gamestore-deploy.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamestore
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: r2-bucket
        run: npx -y wrangler@4 r2 bucket create game-store-files > out.txt 2>&1 || grep -qi "already exists" out.txt
      - name: d1-create
        run: npx -y wrangler@4 d1 create game-store > out.txt 2>&1 || grep -qi "already exists" out.txt
      - name: d1-info
        run: npx -y wrangler@4 d1 info game-store --json > info.json
      - name: d1-id
        run: |
          ID=$(jq -r '.uuid // .id // .database_id' info.json)
          [ -n "$ID" ] && [ "$ID" != "null" ]
          sed -i "s/REPLACE_DB_ID/$ID/" wrangler.toml
      - name: d1-schema
        run: npx -y wrangler@4 d1 execute game-store --remote --file=schema.sql
      - name: deploy
        run: npx -y wrangler@4 deploy
