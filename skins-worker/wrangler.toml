name = "blockcomet-skins"
main = "src/index.js"
compatibility_date = "2024-11-01"

# The workflow creates the KV namespace once and writes its id here before deploying.
[[kv_namespaces]]
binding = "SKINS"
id = "REPLACE_WITH_KV_ID"

# Staff chat inside the developer panel (one room). SQLite-backed Durable Object, available on the free plan.
[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]
