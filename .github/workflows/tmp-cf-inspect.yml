name: tmp-cf-inspect
on:
  push:
    branches: [tmp-cf-inspect]
    paths: ['.github/workflows/tmp-cf-inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List workers in the account
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p out
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACC/workers/scripts" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({'success':d.get('success'),'errors':d.get('errors'),'scripts':[{'id':s.get('id'),'created_on':s.get('created_on'),'modified_on':s.get('modified_on')} for s in (d.get('result') or [])]},indent=1))" > out/scripts.json
          git config user.name bot; git config user.email bot@example.com
          git add out && git commit -m "scripts list" && git push
