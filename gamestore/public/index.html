<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجر الألعاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ecebff;--ink:#17154a;--card:#fff;--blue:#3d5afe;--sun:#ffc93c;--mute:#5b5a86}
@media(prefers-color-scheme:dark){:root{--bg:#14123a;--ink:#f1f0ff;--card:#1f1d52;--mute:#a9a8d6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.7 "Readex Pro",system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:20px 16px 80px}
nav{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.logo{font-weight:700;font-size:20px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block}
.btn.sun{background:var(--sun);color:#17154a}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero{padding:40px 0 24px}
h1{font-size:clamp(34px,7vw,64px);line-height:1.15;margin:0 0 12px;font-weight:700}
.hero p{margin:0 0 22px;color:var(--mute);max-width:46ch}
.search{display:flex;gap:8px;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:6px;box-shadow:6px 6px 0 var(--ink);max-width:560px}
.search input{flex:1;border:0;background:none;padding:10px 12px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:26px 0 18px}
.chip{border:2px solid var(--ink);background:none;border-radius:99px;padding:4px 16px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.game{background:var(--card);border:2px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:5px 5px 0 var(--ink);cursor:pointer;text-align:start;padding:0;transition:transform .15s}
.game:hover{transform:translate(-2px,-2px)}
.game img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;border-bottom:2px solid var(--ink)}
.game div{padding:12px 14px}
.game b{display:block;font-weight:700}
.game small{color:var(--mute)}
.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--mute)}
dialog{border:2px solid var(--ink);border-radius:20px;background:var(--card);color:var(--ink);width:min(560px,94vw);padding:0;box-shadow:8px 8px 0 var(--ink)}
dialog::backdrop{background:#17154acc}
.pad{padding:20px}
.pad img{width:100%;border-radius:12px;border:2px solid var(--ink);max-height:280px;object-fit:cover}
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-weight:500}
input,select,textarea{background:var(--bg);border:2px solid var(--ink);border-radius:10px;padding:8px 10px}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.msg{min-height:1.5em;color:var(--blue);font-weight:500}
.x{background:none;border:0;font-size:22px;cursor:pointer}
@media(prefers-reduced-motion:reduce){.game{transition:none}}
</style>
</head>
<body>
<main>
<nav><span class="logo">متجر الألعاب</span><button class="btn sun" id="openUp">ارفع لعبتك</button></nav>
<section class="hero">
<h1>العب ألعاب صنعها ناس مثلك</h1>
<p>حمّل ألعاب المطورين المستقلين مجاناً، أو انشر لعبتك وخل الكل يجربها.</p>
<form class="search" id="sf" role="search"><input id="q" type="search" placeholder="دوّر على لعبة أو مطوّر" aria-label="بحث"><button class="btn">بحث</button></form>
</section>
<div class="chips" id="chips"></div>
<div class="grid" id="grid" aria-live="polite"></div>
</main>

<dialog id="gd"><div class="pad" id="gbody"></div></dialog>

<dialog id="ud"><div class="pad">
<div class="row"><h2 style="margin:0">انشر لعبتك</h2><button class="x" data-close aria-label="إغلاق">×</button></div>
<form id="uf">
<label>اسم اللعبة<input name="title" required maxlength="60"></label>
<label>اسم المطوّر<input name="developer" required maxlength="40"></label>
<label>التصنيف<select name="category" id="cats"></select></label>
<label>الوصف<textarea name="description" rows="3" required maxlength="1000"></textarea></label>
<label>صورة الغلاف (حتى 5MB)<input type="file" name="cover" accept="image/*" required></label>
<label>ملف اللعبة (حتى 90MB)<input type="file" name="file" required></label>
<div class="msg" id="um" role="status"></div>
<button class="btn" id="ub">انشر</button>
</form></div></dialog>

<script>
const CATS=["أكشن","ألغاز","مغامرات","سباق","ألعاب أطفال","أخرى"];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const size=b=>b>1048576?(b/1048576).toFixed(1)+" MB":Math.ceil(b/1024)+" KB";
let cat="",games=[];
$("#cats").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
function chips(){$("#chips").innerHTML=["الكل",...CATS].map(c=>`<button class="chip" aria-pressed="${(c==="الكل"?"":c)===cat}" data-c="${c}">${c}</button>`).join("")}
chips();
$("#chips").onclick=e=>{const c=e.target.dataset.c;if(!c)return;cat=c==="الكل"?"":c;chips();load()};
$("#sf").onsubmit=e=>{e.preventDefault();load()};
async function load(){
  try{
    const r=await fetch("/api/games?"+new URLSearchParams({q:$("#q").value,cat}));
    games=await r.json();
  }catch{games=[];}
  $("#grid").innerHTML=games.length?games.map((g,i)=>`<button class="game" data-i="${i}"><img loading="lazy" src="/files/${g.cover_key}" alt=""><div><b>${esc(g.title)}</b><small>${esc(g.developer)} · ${esc(g.category)}</small></div></button>`).join(""):`<p class="empty">ما فيه ألعاب هنا بعد. كن أول من ينشر لعبة.</p>`;
}
$("#grid").onclick=e=>{
  const b=e.target.closest(".game");if(!b)return;const g=games[b.dataset.i];
  $("#gbody").innerHTML=`<div class="row"><h2 style="margin:0">${esc(g.title)}</h2><button class="x" data-close aria-label="إغلاق">×</button></div><p><small>${esc(g.developer)} · ${esc(g.category)} · ${size(g.file_size)} · ${g.downloads} تحميل</small></p><img src="/files/${g.cover_key}" alt=""><p style="white-space:pre-wrap">${esc(g.description)}</p><a class="btn" href="/dl/${g.id}">حمّل اللعبة</a>`;
  $("#gd").showModal();
};
document.addEventListener("click",e=>{if(e.target.dataset.close!==undefined)e.target.closest("dialog").close()});
$("#openUp").onclick=()=>$("#ud").showModal();
$("#uf").onsubmit=async e=>{
  e.preventDefault();$("#ub").disabled=true;$("#um").textContent="جاري الرفع…";
  try{
    const r=await fetch("/api/games",{method:"POST",body:new FormData(e.target)});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"فشل الرفع");
    $("#um").textContent="تم النشر";e.target.reset();load();setTimeout(()=>{$("#ud").close();$("#um").textContent=""},800);
  }catch(err){$("#um").textContent=err.message}
  $("#ub").disabled=false;
};
load();
</script>
</body>
</html>
