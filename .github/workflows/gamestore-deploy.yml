name: Game Store Deploy
on:
  push:
    branches: [game-store]
    paths: ['gamestore/**', '.github/workflows/gamestore-deploy.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamestore
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create R2 bucket and D1 database if missing
        run: |
          W="npx -y wrangler@4"
          fail() { echo "::error title=$1::$(tr '\n' ' ' < out.txt | cut -c1-900)"; exit 1; }
          $W r2 bucket create game-store-files > out.txt 2>&1 || grep -qi "already exists" out.txt || fail r2-create
          $W d1 create game-store > out.txt 2>&1 || grep -qi "already exists" out.txt || fail d1-create
          $W d1 info game-store --json > out.txt 2>&1 || fail d1-info
          ID=$(jq -r '.uuid // .id // .database_id' out.txt) || fail d1-parse
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then fail d1-id; fi
          sed -i "s/REPLACE_DB_ID/$ID/" wrangler.toml
          $W d1 execute game-store --remote --file=schema.sql > out.txt 2>&1 || fail d1-execute
      - name: Deploy
        run: npx -y wrangler@4 deploy
