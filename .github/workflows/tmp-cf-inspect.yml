name: tmp-cf-inspect
on:
  push:
    branches: [tmp-cf-inspect]
    paths: ['.github/workflows/tmp-cf-inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deep inspect Cloudflare account
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p out
          A="https://api.cloudflare.com/client/v4/accounts/$CF_ACC"
          q(){ curl -s -H "Authorization: Bearer $CF_TOKEN" "$1" | python3 -c "import sys,json
try:
  d=json.load(sys.stdin)
except Exception as e:
  print('{\"parse_error\":true}'); sys.exit()
print(json.dumps({'success':d.get('success'),'errors':[e.get('message') for e in d.get('errors',[])],'result':d.get('result')},indent=1)[:6000])"; }
          { echo "## token verify"; q "https://api.cloudflare.com/client/v4/user/tokens/verify"
            echo "## scripts"; q "$A/workers/scripts"
            echo "## deployments"; q "$A/workers/scripts/blockcomet-skins/deployments"
            echo "## versions"; q "$A/workers/scripts/blockcomet-skins/versions"
            echo "## pages"; q "$A/pages/projects"
            echo "## kv"; q "$A/storage/kv/namespaces"
            echo "## d1"; q "$A/d1/database"
            echo "## r2"; q "$A/r2/buckets"
            echo "## routes/zones"; q "https://api.cloudflare.com/client/v4/zones"
            echo "## workers domains"; q "$A/workers/domains"
          } > out/deep.txt
          git config user.name bot; git config user.email bot@example.com
          git add out && git commit -m "deep inspect" && git push
