name: BlockComet on Copper

# Builds Copper Launcher (MojoLauncher based, LGPL-3.0) with a yellow theme, own icon/name and a first-run instance
# that has Fabric Loader, Fabric API and Meteor Client for Minecraft 1.20.1 ready. Then runs it in an emulator.
#
# Signing: the repository secrets ANDROID_KEYSTORE_BASE64 + KEYSTORE_PASSWORD re-sign the APK with your key;
# without them it keeps Copper's debug key.

on:
  push:
    branches: [copper-custom, main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'COPYING'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:
    inputs:
      only_emulator:
        description: "Skip the build; run the latest released APK in the emulator"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: copper-${{ github.ref }}
  cancel-in-progress: true

env:
  COPPER_REPO: CopperLauncher/Copper-Android
  COPPER_SHA: cd19296137943c62503d548eadd2a6ff132b998f

jobs:
  # The skin service: a small Cloudflare Worker (free plan) that stores one PNG per player name in KV.
  # Needs the repository secrets CLOUDFLARE_API_TOKEN (permissions: Workers Scripts Edit, Workers KV Storage Edit) and
  # CLOUDFLARE_ACCOUNT_ID. Without them this job is skipped and the launcher only reads the GitHub skin folder.
  skins-api:
    if: ${{ !inputs.only_emulator }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy the skin service
        id: deploy
        working-directory: skins-worker
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -eu
          exec > >(tee deploy-full.log) 2>&1
          # whatever happens, the end of the log goes to the release "skins-api-report" so it can be read without opening Actions
          report() {
            { echo "Deploy of the skin service, commit $GITHUB_SHA"; echo; echo '```'; tail -c 8000 deploy-full.log; echo '```'; } > report.md
            gh release delete skins-api-report --yes --cleanup-tag >/dev/null 2>&1 || true
            gh release create skins-api-report --prerelease --target "$GITHUB_SHA" --title "Skin service deploy report" --notes-file report.md >/dev/null 2>&1 || true
          }
          trap 'sleep 1; report' EXIT
          echo "url=" >> "$GITHUB_OUTPUT"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Skin service::Cloudflare secrets are not set, skipping the deploy (the launcher will only read the GitHub skin folder)."
            exit 0
          fi
          npm install --no-save --silent wrangler@3
          # the account needs a workers.dev subdomain; register one when it has none (a name is free for the first account that takes it)
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('result') or {}).get('subdomain') or '')")
          echo "workers.dev subdomain now: '${SUB}'"
          if [ -z "$SUB" ]; then
            for N in blockcomet blockcomet-skins "blockcomet-$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | cut -c1-6)"; do
              R=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d "{\"subdomain\":\"$N\"}" "$API")
              echo "register $N: $(printf %s "$R" | cut -c1-300)"
              printf %s "$R" | python3 -c "import sys,json; sys.exit(0 if json.load(sys.stdin).get('success') else 1)" && break
            done
          fi
          kv_id() { npx wrangler kv namespace list | python3 -c "import sys,json; print(next((n['id'] for n in json.load(sys.stdin) if n['title']=='blockcomet-skins-SKINS'), ''))"; }
          ID=$(kv_id)
          if [ -z "$ID" ]; then npx wrangler kv namespace create SKINS; ID=$(kv_id); fi
          [ -n "$ID" ] || { echo "::error::could not find or create the KV namespace"; exit 1; }
          sed -i "s/REPLACE_WITH_KV_ID/$ID/" wrangler.toml
          npx wrangler deploy 2>&1 | tee deploy.log
          # developer panel password (GitHub secret ADMIN_PASSWORD, at least 12 characters); without it /admin stays disabled
          if [ -n "${ADMIN_PASSWORD:-}" ]; then printf %s "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD; fi
          URL=$(grep -o 'https://[A-Za-z0-9.-]*workers\.dev' deploy.log | head -n1)
          [ -n "$URL" ] || { echo "::error::deployed, but no workers.dev address in the output (is a workers.dev subdomain set up for the account?)"; exit 1; }
          echo "url=$URL" > "$GITHUB_OUTPUT"
          echo "Skin service: $URL"
          # Featured skins: the names in skins-worker/featured.txt are fetched once from Mojang and kept in KV (a failure here never stops the deploy)
          ID="$ID" python3 - <<'PY3' || echo "featured skins: the seeding step failed"
          import base64, json, os, subprocess, tempfile, time, urllib.request
          ID = os.environ["ID"]
          names = [l.strip() for l in open("featured.txt", encoding="utf-8") if l.strip() and not l.startswith("#")]
          def wrangler(*args):
              return subprocess.run(["npx", "wrangler", "kv", "key", *args, "--namespace-id", ID], capture_output=True, text=True)
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "BlockComet-skins"}), timeout=20) as r:
                  return r.read() if r.status == 200 else b""
          out = wrangler("list", "--prefix", "featured:").stdout
          have = {k["name"] for k in json.loads(out[out.index("["):])} if "[" in out else set()
          added, kept, skipped = [], 0, []
          for name in names:
              key = "featured:" + name.lower()
              if key in have:
                  kept += 1
                  continue
              try:
                  uuid = json.loads(get("https://api.mojang.com/users/profiles/minecraft/" + name))["id"]
                  props = json.loads(get("https://sessionserver.mojang.com/session/minecraft/profile/" + uuid))["properties"]
                  tex = json.loads(base64.b64decode(next(p["value"] for p in props if p["name"] == "textures")))
                  png = get(tex["textures"]["SKIN"]["url"])
                  if not png.startswith(b"\x89PNG") or len(png) > 100000:
                      raise ValueError("not a usable skin")
                  with tempfile.NamedTemporaryFile(suffix=".png", delete=False) as f:
                      f.write(png)
                  done = wrangler("put", key, "--path", f.name, "--metadata", json.dumps({"name": name, "t": int(time.time() * 1000), "featured": True}))
                  os.unlink(f.name)
                  if done.returncode != 0:
                      raise RuntimeError(done.stderr[-200:])
                  added.append(name)
              except Exception as e:
                  skipped.append(name)
              time.sleep(1)
          print("featured skins: %d added, %d already there, %d skipped" % (len(added), kept, len(skipped)))
          if skipped:
              print("featured skins skipped: " + ", ".join(skipped))
          PY3
          # Live test of the deployed service: publish, read, replace, refuse a stranger, delete, name free again
          python3 - <<'PY2'
          import struct, zlib
          raw = b"".join(b"\x00" + b"\x1e\x88\xe5\xff" * 64 for _ in range(64))
          def c(t, d): return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          open("/tmp/skin.png", "wb").write(b"\x89PNG\r\n\x1a\n" + c(b"IHDR", struct.pack(">IIBBBBB", 64, 64, 8, 6, 0, 0, 0)) + c(b"IDAT", zlib.compress(raw)) + c(b"IEND", b""))
          PY2
          N="ci_$(openssl rand -hex 4)"; A=$(openssl rand -hex 24); B=$(openssl rand -hex 24); F="$URL/skins/$N.png"
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          sleep 8
          R=""
          chk() { if [ "$2" = "$3" ]; then R="$R\nPASS  $1 ($2)"; else R="$R\nFAIL  $1 (got $2, wanted $3)"; BAD=1; fi; }
          BAD=0
          chk "no skin yet"                  "$(code "$F")" 404
          chk "publish"                      "$(code -X PUT -H "X-Skin-Token: $A" --data-binary @/tmp/skin.png "$F")" 200
          sleep 1
          chk "read it back"                 "$(code "$F")" 200
          chk "stranger cannot replace"      "$(code -X PUT -H "X-Skin-Token: $B" --data-binary @/tmp/skin.png "$F")" 403
          chk "stranger cannot delete"       "$(code -X DELETE -H "X-Skin-Token: $B" "$F")" 403
          chk "not a skin is refused"        "$(code -X PUT -H "X-Skin-Token: $B" --data-binary 'hello' "$URL/skins/${N}x.png")" 400
          sleep 11
          chk "owner replaces the skin"      "$(code -X PUT -H "X-Skin-Token: $A" --data-binary @/tmp/skin.png "$F")" 200
          chk "owner deletes the skin"       "$(code -X DELETE -H "X-Skin-Token: $A" "$F")" 200
          sleep 1
          chk "gone after delete"            "$(code "$F")" 404
          chk "name can be claimed again"    "$(code -X PUT -H "X-Skin-Token: $B" --data-binary @/tmp/skin.png "$F")" 200
          # Gallery: hidden by default, listed on request, searchable by the start of the name, hidden again on request
          gal() { curl -s "$URL/gallery?q=$N&cb=$RANDOM$RANDOM" | grep -c "\"name\":\"$N\""; }  # the cache-buster keeps the 2-minute edge cache of the gallery out of the test
          poll() { for i in 1 2 3 4 5 6 7 8; do [ "$(gal)" = "$1" ] && break; sleep 4; done; gal; }
          chk "hidden from the gallery by default"  "$(gal)" 0
          chk "stranger cannot list the skin"       "$(code -X PATCH -H "X-Skin-Token: $A" -H "X-Skin-Listed: 1" "$F")" 403
          chk "owner lists the skin"                "$(code -X PATCH -H "X-Skin-Token: $B" -H "X-Skin-Listed: 1" "$F")" 200
          chk "listed skin shows in the gallery"    "$(poll 1)" 1
          chk "owner hides the skin again"          "$(code -X PATCH -H "X-Skin-Token: $B" -H "X-Skin-Listed: 0" "$F")" 200
          chk "hidden skin leaves the gallery"      "$(poll 0)" 0
          code -X DELETE -H "X-Skin-Token: $B" "$F" >/dev/null
          printf "$R\n" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$BAD" = 0 ] || { echo "::error::the live skin service test failed"; exit 1; }

  build:
    needs: skins-api
    if: ${{ always() && !inputs.only_emulator }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Copper (pinned commit, with submodules)
        run: |
          set -eux
          git init copper
          cd copper
          git remote add origin "https://github.com/$COPPER_REPO.git"
          git fetch --depth 1 origin "$COPPER_SHA"
          git checkout --quiet FETCH_HEAD
          git submodule update --init --depth 1 --recursive
          git log -1 --format='%h %s'

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: copper/app_mojo/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: CopperLauncher/Mesa-AAR-Builder
          workflow: build-aar.yml
          workflow_conclusion: success
          name: mesa.aar
          path: copper/app_mojo/libs

      - name: Check the libraries
        run: ls -l copper/app_mojo/libs || echo "no libs dir"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Fabric, Fabric API and Meteor Client (several versions)
        run: bash copper-custom/run-logged.sh "Mods download" bash copper-custom/build-mods.sh copper/app_mojo/src/main/assets

      - name: Fonts (Google Fonts, SIL OFL 1.1 / Ubuntu Font Licence)
        run: bash copper-custom/run-logged.sh "Fonts" bash copper-custom/fetch-fonts.sh copper/app_mojo/src/main/res/font

      - name: Apply BlockComet changes
        env:
          BLOCKCOMET_SOURCE_URL: https://github.com/${{ github.repository }}
          BLOCKCOMET_SKINS_API: ${{ needs.skins-api.outputs.url }}
          BLOCKCOMET_NOTICES_OUT: ${{ github.workspace }}/out/THIRD_PARTY_NOTICES.txt
        run: |
          mkdir -p out
          pip install pillow materialyoucolor
          bash copper-custom/run-logged.sh "apply.sh" bash copper-custom/apply.sh copper

      - name: Build APK
        working-directory: copper
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: bash ../copper-custom/run-logged.sh "assembleFullDebug" gradle :app_mojo:assembleFullDebug --no-daemon

      - name: Sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -eu
          SRC=$(find copper/app_mojo/build/outputs/apk/full/debug -name '*.apk' | head -n1)
          mkdir -p out
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KS_PASS --out out/BlockComet.apk "$SRC"
            echo "SIGNING=your key (from secrets)" >> "$GITHUB_ENV"
          else
            cp "$SRC" out/BlockComet.apk
            echo "SIGNING=Copper debug key (add the secrets for your own key)" >> "$GITHUB_ENV"
          fi
          ls -l out/BlockComet.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs out/BlockComet.apk | head -8

      # The release below is the real download; the artifact is only a spare copy. It must never stop the release
      # (a full Actions storage quota made this step fail and skipped the release), and it expires after one day.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: BlockComet-copper-apk
          path: out/BlockComet.apk
          if-no-files-found: error
          retention-days: 1

      - name: Publish release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          NOTES="Built from Copper ${COPPER_SHA::7} with Fabric/Meteor instances. Signing: $SIGNING. Source and recipe: https://github.com/$GITHUB_REPOSITORY (commit ${GITHUB_SHA::7}). See THIRD_PARTY_NOTICES.txt for the licenses."
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release delete "$GITHUB_REF_NAME" --yes || true
            gh release create "$GITHUB_REF_NAME" out/BlockComet.apk out/THIRD_PARTY_NOTICES.txt \
              --title "BlockComet Launcher $GITHUB_REF_NAME" --notes "$NOTES"
            echo "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/BlockComet.apk"
          else
            gh release delete copper-latest --yes --cleanup-tag || true
            gh release create copper-latest out/BlockComet.apk out/THIRD_PARTY_NOTICES.txt --prerelease --target "$GITHUB_SHA" \
              --title "BlockComet Launcher (latest build)" --notes "$NOTES"
            echo "https://github.com/$GITHUB_REPOSITORY/releases/download/copper-latest/BlockComet.apk"
          fi

  emulator:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || inputs.only_emulator) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: ${{ !inputs.only_emulator }}
        with:
          name: BlockComet-copper-apk

      - name: Download the released APK
        if: ${{ inputs.only_emulator }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download copper-latest -p BlockComet.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            EMU_LOCALE=ar-EG bash copper-custom/emulator-run.sh BlockComet.apk
            bash copper-custom/emulator-skins.sh BlockComet.apk

      - name: Report
        if: always()
        run: |
          for f in alive.txt game-files.txt device.txt skins-result.txt skins-files.txt; do
            [ -f emulator-out/$f ] && { msg=$(head -c 3000 emulator-out/$f | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::notice title=emulator $f::$msg"; }
          done
          [ -f emulator-out/ui-log.txt ] && { msg=$(cut -c1-200 emulator-out/ui-log.txt | tail -n 45 | tail -c 3500 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::notice title=emulator ui-log::$msg"; }
          true

      - name: Publish test results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          ls -l emulator-out || exit 0
          gh release delete copper-test --yes --cleanup-tag || true
          gh release create copper-test emulator-out/* --prerelease --target "$GITHUB_SHA" \
            --title "Launcher emulator run" --notes "Videos (launcher-run.mp4 and skins-demo.mp4: Local account, a typed name, skin editor), screenshots and logs from running the APK in an Android 11 x86_64 emulator. skins-result.txt lists what passed."
